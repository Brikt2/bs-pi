<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gratulerer med lærlingplass!</title>
<style>
  /* Reset */
  * { box-sizing: border-box; margin: 0; padding: 0; z-index: 1;}

  :root{
    --bg: #0f1724;
    --panel: #0b1220;
    --text: #e6eef8;
    --accent: #0ea5a4;
  }

  html,body{
    height:100%;
    background: linear-gradient(180deg,var(--bg), #071020 90%);
    color:var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .gratulerer {
    font-size: 80px;
  }

  .wrap {
    min-height:100%;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .navn-wrapper {
  position: relative;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  font-weight: 900;
}

.navn {
  position: absolute;
  opacity: 0;
  filter: blur(20px);
  transform: scale(1.1);
  transition: 
    opacity 0.8s ease,
    filter 0.8s ease,
    transform 0.8s ease;
}

.navn.active {
  opacity: 1;
  filter: blur(0);
  transform: scale(1);
}

  .boks {
    width: min(360px, 92vw);
    max-width: 1200px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:18px;
    box-shadow: 0 10px 30px rgba(2,6,23,0.6);
    padding: clamp(20px, 4vw, 40px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .oppå{
    z-index: 10;
    width: 100%;
    height: 100%;
    position: absolute;
    left: 0px;
    top: 0px;
  }

  .opperst{
    z-index: 20;
    width: 100%;
    height: 100%;
    position: absolute;
    left: 0px;
    top: 0px;
   /* background: linear-gradient(#0007, #0000),#123; */
    margin: 0;
    overflow: hidden;
  }



  @keyframes firework {
    0% { transform: translate(var(--x), var(--initialY)); width: var(--initialSize); opacity: 1; }
    50% { width: 0.5vmin; opacity: 1; }
    100% { width: var(--finalSize); opacity: 0; }
  }

  /* @keyframes fireworkPseudo {
    0% { transform: translate(-50%, -50%); width: var(--initialSize); opacity: 1; }
    50% { width: 0.5vmin; opacity: 1; }
    100% { width: var(--finalSize); opacity: 0; }
  }
  */
  .firework,
  .firework::before,
  .firework::after
  {
    --initialSize: 1vmin;
    --finalSize: 85vmin;
    --particleSize: 50vmin;
    --color1: yellow;
    --color2: khaki;
    --color3: white;
    --color4: lime;
    --color5: gold;
    --color6: mediumseagreen;
    --y: -30vmin;
    --x: -50%;
    --initialY: 60vmin;
    content: "";
    animation: firework 2s infinite;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, var(--y));
    width: var(--initialSize);
    aspect-ratio: 1;
    background: 
      /*
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 0% 0%,
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 100% 0%,
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 100% 100%,
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 0% 100%,
      */
      
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 50% 0%,
      radial-gradient(circle, var(--color2) var(--particleSize), #0000 0) 100% 50%,
      radial-gradient(circle, var(--color3) var(--particleSize), #0000 0) 50% 100%,
      radial-gradient(circle, var(--color4) var(--particleSize), #0000 0) 0% 50%,
      
      /* bottom right */
      radial-gradient(circle, var(--color5) var(--particleSize), #0000 0) 80% 90%,
      radial-gradient(circle, var(--color6) var(--particleSize), #0000 0) 95% 90%,
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 90% 70%,
      radial-gradient(circle, var(--color2) var(--particleSize), #0000 0) 100% 60%,
      radial-gradient(circle, var(--color3) var(--particleSize), #0000 0) 55% 80%,
      radial-gradient(circle, var(--color4) var(--particleSize), #0000 0) 70% 77%,
      
      /* bottom left */
      radial-gradient(circle, var(--color5) var(--particleSize), #0000 0) 22% 90%,
      radial-gradient(circle, var(--color6) var(--particleSize), #0000 0) 45% 90%,
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 33% 70%,
      radial-gradient(circle, var(--color2) var(--particleSize), #0000 0) 10% 60%,
      radial-gradient(circle, var(--color3) var(--particleSize), #0000 0) 31% 80%,
      radial-gradient(circle, var(--color4) var(--particleSize), #0000 0) 28% 77%,
      radial-gradient(circle, var(--color5) var(--particleSize), #0000 0) 13% 72%,
      
      /* top left */
      radial-gradient(circle, var(--color6) var(--particleSize), #0000 0) 80% 10%,
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 95% 14%,
      radial-gradient(circle, var(--color2) var(--particleSize), #0000 0) 90% 23%,
      radial-gradient(circle, var(--color3) var(--particleSize), #0000 0) 100% 43%,
      radial-gradient(circle, var(--color4) var(--particleSize), #0000 0) 85% 27%,
      radial-gradient(circle, var(--color5) var(--particleSize), #0000 0) 77% 37%,
      radial-gradient(circle, var(--color6) var(--particleSize), #0000 0) 60% 7%,
      
      /* top right */
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 22% 14%,
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 45% 20%,
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 33% 34%,
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 10% 29%,
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 31% 37%,
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 28% 7%,
      radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 13% 42%
      ;
    background-size: var(--initialSize) var(--initialSize);
    background-repeat: no-repeat;
  }

  .firework::before {
    --x: -50%;
    --y: -50%;
    --initialY: -50%;
  /*   transform: translate(-20vmin, -2vmin) rotate(40deg) scale(1.3) rotateY(40deg); */
    transform: translate(-50%, -50%) rotate(40deg) scale(1.3) rotateY(40deg);
  /*   animation: fireworkPseudo 2s infinite; */
  }

  .firework::after {
    --x: -50%;
    --y: -50%;
    --initialY: -50%;
  /*   transform: translate(44vmin, -50%) rotate(170deg) scale(1.15) rotateY(-30deg); */
    transform: translate(-50%, -50%) rotate(170deg) scale(1.15) rotateY(-30deg);
  /*   animation: fireworkPseudo 2s infinite; */
  }

  .firework:nth-child(2) {
    --x: 30vmin;
  }

  .firework:nth-child(2),
  .firework:nth-child(2)::before,
  .firework:nth-child(2)::after {
    --color1: pink;
    --color2: violet;
    --color3: fuchsia;
    --color4: orchid;
    --color5: plum;
    --color6: lavender;  
    --finalSize: 70vmin;
    left: 30%;
    top: 60%;
    animation-delay: -0.25s;
  }

  .firework:nth-child(3) {
    --x: -30vmin;
    --y: -50vmin;
  }

  .firework:nth-child(3),
  .firework:nth-child(3)::before,
  .firework:nth-child(3)::after {
    --color1: cyan;
    --color2: lightcyan;
    --color3: lightblue;
    --color4: PaleTurquoise;
    --color5: SkyBlue;
    --color6: lavender;
    --finalSize: 35vmin;
    left: 70%;
    top: 60%;
    animation-delay: -0.4s;
  }


  .bjelle1 {
    position: absolute;
    top: 20px;
    left: 20px;
    rotate: -30deg;
  }
  .bjelle2 {
    position: absolute;
    top: 20px;
    right: 20px;
    rotate: 30deg;
  }

  .container {
  margin-top: 16px;
  min-height: 300px;
  background: #f0f0f0;
  border: 4px solid cornflowerblue;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  }

  @keyframes bell-keyframes {
    0% {
      transform: rotate(0deg);
    }
    10% {
      transform: rotate(21deg);
    }
    20% {
      transform: rotate(-14deg);
    }
    30% {
      transform: rotate(21deg);
    }
    40% {
      transform: rotate(-10deg);
    }
    50% {
      transform: rotate(18deg);
    }
    60% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }

  .belll {
    display: inline-block;
    font-size: 128px;
    filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.04)) drop-shadow(0 4px 3px rgb(0 0 0 / 0.1));
  }

  .bell-animation {
    animation-duration: 1s;
    animation-iteration-count: var(--times, 1);
    animation-name: bell-keyframes;
    transform-origin: top center;
  }
  
  @media (max-width:420px){
    .clock { padding: 12px; border-radius: 12px; }
    .hhmm { gap: 8px; }
  }

.pyro {
  position: absolute;
  top: 30%;
  left: 50%;
  width: 0;
  height: 0;
}

.particle {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: hsl(calc(360 * var(--i)), 100%, 50%);
  animation: explode 1s ease-out forwards;
}

.particle:nth-child(1) { --i: 0; transform: translate(0,0);}
.particle:nth-child(2) { --i: 0.2; transform: translate(0,0);}
.particle:nth-child(3) { --i: 0.4; transform: translate(0,0);}
.particle:nth-child(4) { --i: 0.6; transform: translate(0,0);}
.particle:nth-child(5) { --i: 0.8; transform: translate(0,0);}

@keyframes explode {
  0% { transform: translate(0,0); opacity: 1; }
  100% { 
    transform: translate(calc(var(--x) * 100px), calc(var(--y) * -100px));
    opacity: 0;
  }
}

/* Legg til tilfeldig retning for hver partikkel */
.particle:nth-child(1) { --x: 1; --y: 1; }
.particle:nth-child(2) { --x: -1; --y: 1; }
.particle:nth-child(3) { --x: 0.5; --y: 1; }
.particle:nth-child(4) { --x: -0.5; --y: 1; }
.particle:nth-child(5) { --x: 0; --y: 1; }

.firework:nth-child(4),
.firework:nth-child(4)::before,
.firework:nth-child(4)::after {
  --color1: orange; --color2: orangered; --color3: yellow; --color4: gold; --color5: coral; --color6: tomato;
  --finalSize: 60vmin;
  left: 25%;
  top: 55%;
  animation-delay: -0.3s;
}

.firework:nth-child(5),
.firework:nth-child(5)::before,
.firework:nth-child(5)::after {
  --color1: purple; --color2: violet; --color3: orchid; --color4: plum; --color5: fuchsia; --color6: mediumorchid;
  --finalSize: 65vmin;
  left: 75%;
  top: 50%;
  animation-delay: -0.35s;
}

.firework:nth-child(6),
.firework:nth-child(6)::before,
.firework:nth-child(6)::after {
  --color1: lime; --color2: lightgreen; --color3: chartreuse; --color4: springgreen; --color5: greenyellow; --color6: palegreen;
  --finalSize: 55vmin;
  left: 50%;
  top: 40%;
  animation-delay: -0.4s;
}


</style>
</head>
<body>
  <div class="wrap">
    <h1 class="gratulerer">Gratulerer med lærlingplass</h1>
    <div class="boks" role="region">
      <div class="navn-wrapper">
        <div class="navn active">Kristoffer</div>
        <div class="navn">Albertine</div>
        <div class="navn">Darin</div>
        <div class="navn">Magnus</div>
      </div>
    </div>
  </div>
  <div class="oppå">
    <div class="bjelle1">
      <span class="bell belll">
        🔔
      </span>
    </div>
    <div class="bjelle2">
      <span class="bell belll">
        🔔
      </span>
    </div>
  </div>
  <div class="opperst">
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>
  </div>

<script>
const bells = document.querySelectorAll(".bell");

function startRing(bell) {
  bell.style.animation = "none";
  void bell.offsetHeight;
  bell.style.animation = "bell-keyframes 1s 1";
}

bells.forEach(bell => {
  bell.addEventListener("animationend", () => {
    setTimeout(() => startRing(bell), 300);
  });

  startRing(bell);
});

const navn = document.querySelectorAll(".navn");
let current = 0;

function loopNavn() {
  navn[current].classList.remove("active");
  
  current = (current + 1) % navn.length;
  
  navn[current].classList.add("active");
}

setInterval(loopNavn, 2500);

</script>
</body>
</html>
