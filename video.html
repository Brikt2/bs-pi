<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<title>Portrait 4K Video</title>

<style>
  /* Fullskjerm body */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: black;
  }

  /* Container for video */
  #videoContainer {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Video styling: fyll skjermen og roter */
  video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vh;  /* Bytt width/height for å fylle portrait */
    height: 100vw;
    object-fit: cover; /* Fyll hele skjermen */
    transform: rotate(90deg) translate(0, -100%);
    transform-origin: center center;
    background-color: black;
  }
</style>
</head>
<body>

<div id="videoContainer">
  <video id="myVideo" autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
    Din nettleser støtter ikke HTML5-video.
  </video>
</div>

<script>
  // JavaScript for sikker autoplay på alle enheter
  const video = document.getElementById('myVideo');

  video.addEventListener('loadedmetadata', () => {
    video.play().catch(err => {
      console.warn("Autoplay feilet, brukeren må starte videoen manuelt:", err);
    });
  });

  // Resize video når vinduet endres
  window.addEventListener('resize', () => {
    // Dette holder videoen sentrert i alle skjermstørrelser
    video.style.width = `${window.innerHeight}px`;
    video.style.height = `${window.innerWidth}px`;
  });
</script>

</body>
</html>
