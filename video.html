<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<title>BrightAuthor Rotated – Scale Fix</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

/* Wrapper som fyller etter rotasjon */
#wrap {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Tving video til å fylle hele rotert flate */
video {
  min-width: 100%;
  min-height: 100%;
  object-fit: cover;
  background: black;
}
</style>
</head>

<body>

<div id="wrap">
  <video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>
</div>

</body>
</html>
