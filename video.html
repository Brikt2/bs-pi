<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<title>Portrait Video – BrightSign Safe</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

/* Hele scenen roteres – ikke video direkte */
#stage {
  position: absolute;
  width: 100vh;
  height: 100vw;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(90deg);
  transform-origin: center;
  overflow: hidden;
  background: black;
}

/* Video fyller scenen korrekt */
#stage video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: black;
}
</style>
</head>

<body>

<div id="stage">
  <video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
    Nettleseren støtter ikke HTML5-video.
  </video>
</div>

</body>
</html>
