<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>NRK Ticker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&display=swap');

  :root {
    --ticker-height: clamp(52px, 7vh, 84px);
    --label-font-size: clamp(0.72rem, 1vw, 1rem);
    --headline-font-size: clamp(1.15rem, 1.8vw, 1.75rem);
    --item-gap: clamp(56px, 6vw, 90px);
    --label-padding-x: clamp(10px, 1.2vw, 18px);
    --label-gap: clamp(6px, 0.7vw, 10px);
    --border-size: clamp(2px, 0.25vw, 4px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    height: var(--ticker-height);
    display: flex;
    align-items: stretch;
    font-family: 'Barlow Condensed', sans-serif;
  }

  #label {
    background: #e8001e;
    display: flex;
    align-items: center;
    gap: var(--label-gap);
    padding: 0 var(--label-padding-x);
    flex-shrink: 0;
    font-weight: 800;
    font-size: var(--label-font-size);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
    white-space: nowrap;
  }

  #label .dot {
    width: clamp(6px, 0.7vw, 10px);
    height: clamp(6px, 0.7vw, 10px);
    border-radius: 50%;
    background: #fff;
    animation: blink 1.2s infinite;
  }

  @keyframes blink {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.2; }
  }

  #wrap {
    flex: 1;
    overflow: hidden;
    display: flex;
    align-items: center;
    border-top: var(--border-size) solid #e8001e;
    border-bottom: var(--border-size) solid #e8001e;
  }

  #track {
    display: flex;
    align-items: center;
    white-space: nowrap;
    will-change: transform;
  }

  .item {
    display: inline-flex;
    align-items: center;
    font-size: var(--headline-font-size);
    font-weight: 500;
    color: #fff;
    letter-spacing: 0.02em;
    padding-right: var(--item-gap);
  }

  .item::before {
    content: '◆';
    color: #f0c040;
    font-size: clamp(0.6rem, 0.85vw, 0.95rem);
    margin-right: clamp(16px, 1.4vw, 24px);
    flex-shrink: 0;
  }

  @media (orientation: portrait) {
    :root {
      --ticker-height: clamp(74px, 9vh, 120px);
      --label-font-size: clamp(0.95rem, 1.6vw, 1.35rem);
      --headline-font-size: clamp(1.45rem, 2.6vw, 2.35rem);
      --item-gap: clamp(72px, 8vw, 130px);
      --label-padding-x: clamp(14px, 2vw, 24px);
      --label-gap: clamp(8px, 1vw, 14px);
      --border-size: clamp(3px, 0.35vw, 5px);
    }
  }

  @media (max-width: 640px) {
    :root {
      --ticker-height: clamp(48px, 8vh, 68px);
      --headline-font-size: clamp(1rem, 4.8vw, 1.3rem);
      --item-gap: clamp(44px, 8vw, 72px);
    }
  }
</style>
</head>
<body>

<div id="label">
  <span class="dot"></span>
  NYHETER
</div>

<div id="wrap">
  <div id="track"></div>
</div>

<script>
  const RSS_URL = 'https://www.nrk.no/toppsaker.rss';
  const FEED_SOURCES = [
    RSS_URL,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(RSS_URL)}`,
    `https://corsproxy.io/?url=${encodeURIComponent(RSS_URL)}`
  ];

  let anim = null;
  let currentHeadlines = ['Laster nyheter...'];

  async function loadTicker() {
    try {
      const text = await fetchFeedXml();
      const titles = parseTitles(text);
      currentHeadlines = titles.length ? titles : ['Ingen nyheter tilgjengelig'];
      buildTrack(currentHeadlines);
    } catch(e) {
      console.error('Ticker feil:', e);
      currentHeadlines = ['Kunne ikke laste nyheter – sjekk nettverkstilkoblingen'];
      buildTrack(currentHeadlines);
    }
  }

  async function fetchFeedXml() {
    let lastError = null;

    for (const url of FEED_SOURCES) {
      try {
        const res = await fetch(url, {
          headers: { 'Accept': 'application/rss+xml, application/xml, text/xml, text/plain' },
          cache: 'no-store'
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status} fra ${url}`);
        }

        const text = await res.text();
        if (!text || text.trim().startsWith('<!DOCTYPE html')) {
          throw new Error(`Ugyldig feed-svar fra ${url}`);
        }

        return text;
      } catch (error) {
        lastError = error;
      }
    }

    throw lastError || new Error('Fant ingen lesbar RSS-kilde');
  }

  function parseTitles(xmlText) {
    const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
    const parseError = xml.querySelector('parsererror');

    if (parseError) {
      throw new Error('Kunne ikke tolke RSS-feeden');
    }

    return [...xml.querySelectorAll('item > title, entry > title')]
      .map(el => el.textContent.trim())
      .filter(Boolean)
      .slice(0, 3);
  }

  function buildTrack(headlines) {
    const track = document.getElementById('track');

    if (anim) { anim.cancel(); anim = null; }

    // Render one set first to measure width
    track.innerHTML = headlines.map(h => `<span class="item">${h}</span>`).join('');

    requestAnimationFrame(() => {
      const screenW = window.innerWidth;
      const singleW = track.scrollWidth;

      // Repeat enough copies so one full set is always wider than the screen,
      // then double it for a seamless loop
      const copies  = Math.ceil(screenW / singleW) + 2;
      const loopSet = Array(copies).fill(headlines).flat();
      const all     = [...loopSet, ...loopSet];

      track.innerHTML = all.map(h => `<span class="item">${h}</span>`).join('');

      requestAnimationFrame(() => {
        const half     = track.scrollWidth / 2;
        const duration = (half / 90) * 1000; // 90px/s — adjust speed here
        anim = track.animate(
          [{ transform: 'translateX(0)' }, { transform: `translateX(-${half}px)` }],
          { duration, iterations: Infinity, easing: 'linear' }
        );
      });
    });
  }

  // Load now, then refresh every 5 minutes
  loadTicker();
  setInterval(loadTicker, 5 * 60 * 1000);
  window.addEventListener('resize', () => buildTrack(currentHeadlines));
</script>
</body>
</html>
