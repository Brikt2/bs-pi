<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NRK Nyheter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Roboto",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f7f7f7;
        color: #141414;
        line-height: 1.6;
        padding: 20px;
      }

      #div {
        max-width: 680px;
        margin: 0 auto;
        background: white;
        padding: 32px;
        border-radius: 0;
      }

      .nyhet {
        animation: fadeIn 0.6s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        font-size: 32px;
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 20px;
        color: #141414;
      }

      p {
        font-size: 18px;
        line-height: 1.7;
        margin-bottom: 24px;
        color: #141414;
      }

      img {
        width: 100%;
        height: auto;
        display: block;
        margin-top: 24px;
      }

      .tid {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }

      .tid::before {
        content: "";
        width: 12px;
        height: 12px;
        background: #0057b7;
        border-radius: 50%;
      }

      .tid-tekst {
        font-size: 16px;
        font-weight: 700;
        color: #141414;
      }

      .logo {
        text-align: center;
        margin-bottom: 24px;
        font-size: 28px;
        font-weight: 700;
        color: #0057b7;
      }

      @media (max-width: 768px) {
        #div {
          padding: 20px;
        }

        h1 {
          font-size: 26px;
        }

        p {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo">NRK Nyheter</div>
    <div id="div"></div>
    <script>
      function getTid() {
        const now = new Date();
        return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      }

      async function hent_nyheter() {
        const nyheter_url = "https://www.nrk.no/toppsaker.rss";
        const proxy_url = `https://api.rss2json.com/v1/api.json?rss_url=${nyheter_url}&api_key=gwggcsutiwlzxrleyq6k24dact4w4swgcvsd9qmq&t=${Date.now()}`;

        const respons = await fetch(proxy_url);
        const data = await respons.json();
        console.log(data);
        vis_nyhet1(data);
      }
      hent_nyheter();

      function vis_nyhet1(data) {
        const nyheter = data.items.filter((nyhet) => nyhet.enclosure.link);
        console.log(nyheter);
        console.log(data);
        const nyhet1 = nyheter[0];
        const nyhet2 = nyheter[1];
        const nyhet3 = nyheter[2];
        const boks = document.getElementById("div");
        boks.innerHTML = "";
        const div = document.createElement("div");
        div.classList.add("nyhet");
        div.innerHTML = `
          <div class="tid">
            <span class="tid-tekst">${getTid()}</span>
          </div>
          <h1>${nyhet1.title}</h1>
          <p>${nyhet1.description}</p>
          <img src='${nyhet1.enclosure.link}' alt='${nyhet1.title}'>
        `;
        boks.appendChild(div);
        setTimeout(() => vis_nyhet2(nyhet2, nyhet3), 20000);
      }

      function vis_nyhet2(nyhet2, nyhet3) {
        const boks = document.getElementById("div");
        boks.innerHTML = "";
        const div = document.createElement("div");
        div.classList.add("nyhet");
        div.innerHTML = `
          <div class="tid">
            <span class="tid-tekst">${getTid()}</span>
          </div>
          <h1>${nyhet2.title}</h1>
          <p>${nyhet2.description}</p>
          <img src='${nyhet2.enclosure.link}' alt='${nyhet2.title}'>
        `;
        boks.appendChild(div);
        setTimeout(() => vis_nyhet3(nyhet3), 20000);
      }

      function vis_nyhet3(nyhet3) {
        const boks = document.getElementById("div");
        boks.innerHTML = "";
        const div = document.createElement("div");
        div.classList.add("nyhet");
        div.innerHTML = `
          <div class="tid">
            <span class="tid-tekst">${getTid()}</span>
          </div>
          <h1>${nyhet3.title}</h1>
          <p>${nyhet3.description}</p>
          <img src='${nyhet3.enclosure.link}' alt='${nyhet3.title}'>
        `;
        boks.appendChild(div);
        setTimeout(hent_nyheter, 20000);
      }
    </script>
  </body>
</html>
